[project]
name = "devflow-ai"
version = "0.1.0"
description = "Evidence-driven software engineering agent system"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
